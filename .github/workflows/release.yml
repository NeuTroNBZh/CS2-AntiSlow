name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AntiSlow.slnx -c Release

      - name: Test
        run: dotnet test tests/AntiSlow.Core.Tests -c Release --no-build

      - name: Create release archive
        run: |
          mkdir -p dist
          cd addons
          zip -r ../dist/AntiSlowPlugin-${{ github.ref_name }}.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AntiSlowPlugin-${{ github.ref_name }}.zip
          generate_release_notes: true
